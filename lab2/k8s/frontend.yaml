apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-frontend
  template:
    metadata:
      labels:
        app: s3-frontend
    spec:
      containers:
        - name: frontend
          image: lab2-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: s3-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP